name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node dependencies if present
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          else
            echo "No Node package manifest found; skipping npm install."
          fi

      - name: Configure backend
        run: cmake -S backend -B backend/build-ci -DCMAKE_BUILD_TYPE=Release

      - name: Build backend
        run: cmake --build backend/build-ci --config Release --parallel 2

      - name: Run backend example input
        run: ./backend/build-ci/rmobi

      - name: Validate JSON outputs
        run: python3 tests/validate_json_outputs.py

      - name: Web smoke test
        run: python3 tests/web_smoke.py
