<script>
const width = 1200, height = 620;
const margin = { top: 10, right: 40, bottom: 250, left: 80 };
const colorMap = {
  persisted:   "#3B75AF", // soft royal blue
  emerged:     "#E3B23C", // warm golden peach
  disappeared: "#3FA67A", // mint teal
  transferred: "#D95F6A"  // coral rose
};


const keys = Object.keys(colorMap);
const pageSize = 10;

const diseaseNames = {
  "MDRB": "Multi Drug Resistant Bacteria (MDRB)",
  "rCDI": "recurrent Clostridioides difficile infection (rCDI)",
  "Melanoma": "Melanoma"
};

// --- One SVG, one inner group ---
const svg = d3.select("#chartSvg")
  .attr("viewBox", `0 0 ${width} ${height}`)
  .style("background", "#fff");

const g = svg.append("g")
  .attr("transform", `translate(${margin.left},${margin.top})`);

let activeStatus = "all";

function getActiveKeys() {
  if (activeStatus === "all") return keys;
  return [activeStatus];
}



// --- State for current disease + pagination + cached processed data ---
let RAW = null;
let currentDisease = null;
let currentPage = 0;
let sorted = [];
let totalPages = 1;
let yDomainMax = 5;

function preprocessDisease(disease, activeKeys) {
  const data = RAW[disease].map(d => ({
    colocalization: d.colocalization,
    status: (d.status || "").toLowerCase(),
    patients: +d.patients || 0
  }));

  const aggPairs = d3.rollups(
    data,
    v => d3.sum(v, d => d.patients),
    d => d.colocalization,
    d => d.status
  );

  const combined = aggPairs.map(([coloc, statusMap]) => {
    const obj = { colocalization: coloc };
    statusMap.forEach(([s, c]) => (obj[s] = c));

    // filtered total
    obj.viewTotal = activeKeys.reduce((sum, k) => sum + (Number(obj[k]) || 0), 0);

    // optional: still keep overall total if you want
    obj.total = Object.values(obj)
      .filter(v => typeof v === "number")
      .reduce((a, b) => a + b, 0);

    return obj;
  }).filter(d => d.viewTotal > 0);  // only keep non-zero for selected status

  // Sort by filtered total
  const sortedLocal = combined.sort((a, b) => d3.descending(a.viewTotal, b.viewTotal));

  const maxVal = d3.max(sortedLocal, d => d.viewTotal) || 1;
  const yMax = Math.max(maxVal, 5);

  return { sortedLocal, yMax };
}

function setButtonsDisabled() {
  d3.select("#prevBtn").attr("disabled", currentPage === 0 ? true : null);
  d3.select("#nextBtn").attr("disabled", currentPage >= totalPages - 1 ? true : null);
}

function drawPage() {
  g.selectAll("*").remove();

  const start = currentPage * pageSize;
  const pageData = sorted.slice(start, start + pageSize);

  const activeKeys = getActiveKeys();

  const displayName = diseaseNames[currentDisease] || currentDisease;
  d3.select("#chartTitle").text(displayName);
  d3.select("#pageBadge").text(`Page ${currentPage + 1}/${totalPages}`);

  if (!pageData.length) {
    g.append("text")
      .attr("x", (width - margin.left - margin.right) / 2)
      .attr("y", 60)
      .attr("text-anchor", "middle")
      .style("fill", "#6c757d")
      .style("font-size", "24px")
      .text("No data for this selection.");
    setButtonsDisabled();
    return;
  }
  const stacked = d3.stack().keys(activeKeys)(pageData);

  const innerW = width - margin.left - margin.right;
  const innerH = height - margin.top - margin.bottom;

  const x = d3.scaleBand()
    .domain(pageData.map(d => d.colocalization))
    .range([0, innerW])
    .padding(0.25);

  const y = d3.scaleLinear()
    .domain([0, yDomainMax])
    .nice()
    .range([innerH, 0]);

  // Gridlines (y)
  g.append("g")
    .attr("class", "grid")
    .call(
      d3.axisLeft(y)
        .ticks(6)
        .tickSize(-innerW)
        .tickFormat("")
    );

  // Y axis (light)
  const yAxisG = g.append("g")
  .attr("class", "axis")
  .call(
    d3.axisLeft(y)
      .ticks(6)
      .tickFormat(d3.format("d"))
  )
  .call(sel => sel.select(".domain").remove());

  //
  yAxisG.selectAll(".tick text")
    .style("font-size", "28px")
    .style("font-weight", 600);


  // X axis
  const xAxis = g.append("g")
    .attr("class", "axis")
    .attr("transform", `translate(0,${innerH})`)
    .call(d3.axisBottom(x).tickSize(0))
    .call(sel => sel.select(".domain").remove());

  // Proper slanted labels
  xAxis.selectAll("text")
    .style("text-anchor", "end")
    .attr("transform", "rotate(-89)")
    .attr("dx", "-0.6em")
    .attr("dy", "0.25em")
    .style("font-size", "32px")
    .style("font-weight", 700)
    .style("fill", "#495057");

  // Axis label
  g.append("text")
    .attr("x", -48)
    .attr("y", innerH / 2)
    .attr("transform", `rotate(-90, ${-48}, ${innerH / 2})`)
    .style("fill", "#495057")
    .style("font-size", "32px")
    .style("font-weight", 1000)
    .text("Patients");

  // Bars
  const t = d3.transition().duration(350);

  const layer = g.selectAll(".layer")
    .data(stacked, d => d.key)
    .join("g")
    .attr("class", "layer")
    .attr("fill", d => colorMap[d.key]);

  const rects = layer.selectAll("rect")
    .data(d => d, d => d.data.colocalization)
    .join("rect")
    .attr("x", d => x(d.data.colocalization))
    .attr("width", x.bandwidth())
    .attr("y", innerH)                 // animate up
    .attr("height", 0)
    .attr("rx", 1)                      // rounded corners
    .attr("ry", 1)
    .attr("stroke", "rgba(17,24,39,0.45)")   // subtle near-black
    .attr("stroke-width", 0.9)
    .attr("shape-rendering", "crispEdges");
;


  rects.transition(t)
    .attr("y", d => y(d[1]))
    .attr("height", d => Math.max(0, y(d[0]) - y(d[1])));

  // Hover: subtle highlight + tooltip
  rects
    .on("mouseenter", function(event, d) {
      d3.select(this).attr("opacity", 0.85);

      const segment = Math.round(d[1] - d[0]);
      const total = d.data.viewTotal;
      const pct = total ? ((segment / total) * 100).toFixed(1) : "0.0";

      showTip(
        `<div style="font-weight:700; margin-bottom:6px;">${d.data.colocalization}</div>
         <div><b>Segment:</b> ${segment} patients</div>
         <div><b>Total:</b> ${total}</div>
         <div><b>Share:</b> ${pct}%</div>`,
        event
      );
    })
    .on("mousemove", function(event) {
      moveTip(event);
    })
    .on("mouseleave", function() {
      d3.select(this).attr("opacity", 1);
      hideTip();
    });

    // --- TOTAL labels on top of each stack ---
    g.selectAll(".total-label")
      .data(pageData, d => d.colocalization)
      .join("text")
      .attr("class", "total-label")
      .attr("text-anchor", "middle")
      .attr("x", d => x(d.colocalization) + x.bandwidth() / 2)
      .attr("y", d => y(d.viewTotal) - 6)
      .style("font-size", "24px")
      .style("font-weight", 600)
      .style("fill", "#111827")
      .text(d => d3.format(",")(d.viewTotal));
// --- SEGMENT labels inside stacks ---
const minLabelHeightPx = 14; // hide labels for tiny segments

const segmentLabels = g.selectAll(".segment-label-layer")
  .data(stacked, s => s.key)
  .join("g")
  .attr("class", "segment-label-layer");

segmentLabels.selectAll("text")
  .data(s => s.map(d => ({ ...d, key: s.key })), d => d.data.colocalization)
  .join("text")
  .attr("class", "segment-label")
  .attr("text-anchor", "middle")
  .attr("x", d => x(d.data.colocalization) + x.bandwidth() / 2)
  .attr("y", d => (y(d[0]) + y(d[1])) / 2) // center of segment
  .style("font-size", "18px")
  .style("font-weight", 600)
  .style("fill", "#111827") 
  .style("pointer-events", "none")
  .text(d => {
    const v = Math.round(d[1] - d[0]); // segment value
    const h = Math.abs(y(d[0]) - y(d[1])); // pixel height
    return (v > 1 && h >= minLabelHeightPx) ? d3.format(",")(v) : "";
  });

  setButtonsDisabled();
}


function setDisease(disease) {
  currentDisease = disease;
  currentPage = 0;

  const activeKeys = getActiveKeys();
  const { sortedLocal, yMax } = preprocessDisease(disease, activeKeys);

  sorted = sortedLocal;
  yDomainMax = yMax;
  totalPages = Math.max(1, Math.ceil(sorted.length / pageSize));

  drawLegendBox();
  drawPage();

}



d3.select("#statusSelect").on("change", function () {
  activeStatus = this.value;
  currentPage = 0;

  const activeKeys = getActiveKeys();
  const { sortedLocal, yMax } = preprocessDisease(currentDisease, activeKeys);

  sorted = sortedLocal;
  yDomainMax = yMax;
  totalPages = Math.max(1, Math.ceil(sorted.length / pageSize));

  drawLegendBox();
  drawPage();
});



// Pagination handlers (one set)
d3.select("#nextBtn").on("click", () => {
  if (currentPage < totalPages - 1) {
    currentPage++;
    drawPage();
  }
});
d3.select("#prevBtn").on("click", () => {
  if (currentPage > 0) {
    currentPage--;
    drawPage();
  }
});

// Load JSON, populate dropdown, draw initial
d3.json("json/temporal_dynamics_disease.json").then(rawData => {
  RAW = rawData;
  const diseases = Object.keys(RAW);

  const barSelect = d3.select("#diseaseSelect");
  barSelect.selectAll("option")
    .data(diseases)
    .join("option")
    .attr("value", d => d)
    .text(d => diseaseNames[d] || d);

  const defaultDisease = diseases.includes("Melanoma") ? "Melanoma" : diseases[0];

  barSelect.property("value", defaultDisease);
  setDisease(defaultDisease);

  barSelect.on("change", function() {
    setDisease(this.value);
  });
});



function drawLegendBox() {
  const legend = d3.select("#legendBox");

  legend.selectAll("*").remove();

  const activeKeys = getActiveKeys();

  activeKeys.forEach(k => {
    const row = legend.append("div")
      .attr("class", "chart-legend-item");

    row.append("div")
      .attr("class", "chart-legend-dot")
      .style("background", colorMap[k]);

    row.append("div")
      .text(k.charAt(0).toUpperCase() + k.slice(1));
  });
}

drawLegendBox();


const tip = d3.select("#chartTip");

function showTip(html, event) {
  tip.html(html)
    .style("opacity", 1)
    .style("left", `${event.offsetX}px`)
    .style("top", `${event.offsetY}px`);
}
function moveTip(event) {
  tip.style("left", `${event.offsetX}px`)
     .style("top", `${event.offsetY}px`);
}
function hideTip() {
  tip.style("opacity", 0);
}

async function downloadAreaAsPDF(areaId, fileNameBase) {
  const area = document.getElementById(areaId);
  if (!area) {
    console.error(`Missing #${areaId}`);
    return;
  }
  // hide tooltip if present
  const tip = document.getElementById("chartTip");
  const prevOpacity = tip ? tip.style.opacity : null;
  if (tip) tip.style.opacity = 0;

  const canvas = await html2canvas(area, {
    backgroundColor: "#ffffff",
    scale: 2,
    useCORS: true
  });

  if (tip && prevOpacity !== null) tip.style.opacity = prevOpacity;

  const imgData = canvas.toDataURL("image/png");
  const { jsPDF } = window.jspdf;

  const pxToPt = px => px * 0.75;
  const pdfW = pxToPt(canvas.width);
  const pdfH = pxToPt(canvas.height);

  const pdf = new jsPDF({
    orientation: pdfW >= pdfH ? "landscape" : "portrait",
    unit: "pt",
    format: [pdfW, pdfH]
  });

  pdf.addImage(imgData, "PNG", 0, 0, pdfW, pdfH);
  pdf.save(fileNameBase + ".pdf");
}

const sankeySvg = d3.select("#sankeySvg")
  .attr("viewBox", `0 0 1200 520`)
  .style("background", "#fff");

const sankeyG = sankeySvg.append("g").attr("transform", "translate(20,20)");

const PHASES = ["Donor", "PreFMT", "PostFMT1", "PostFMT2", "PostFMT3"];
const phaseOrder = { Donor: 0, PreFMT: 0, PostFMT1: 2, PostFMT2: 3, PostFMT3: 4 };
const phaseIndex = new Map(PHASES.map((p, i) => [p, i]));

function buildSankeyGraph(rows) {
  const phases = ["Donor", "PreFMT", "PostFMT1", "PostFMT2", "PostFMT3"];

  const nodes = phases.map(name => ({ name }));
  const idx = new Map(nodes.map((n, i) => [n.name, i]));

  const links = rows.map(r => ({
    source: idx.get(r.from),
    target: idx.get(r.to),
    value: +r.patients || 0,
    status: (r.status || "").toLowerCase()
  })).filter(l => l.value > 0);

  return { nodes, links };
}


function tpToPhase(tp) {
  if (tp === 1000) return "Donor";
  if (tp === 0) return "PreFMT";
  if (tp > 0 && tp < 31) return "PostFMT1";
  if (tp > 30 && tp < 61) return "PostFMT2";
  if (tp > 60 && tp < 1000) return "PostFMT3";
}

function colocKeyFromNode(n) {
  return `${n.argId}|${n.mgeId}`;
}

function classifyStatus(p) {
  const hasDonor = (p.Donor || 0) > 0;
  const hasPre   = (p.PreFMT || 0) > 0;
  const hasPost  = ((p.PostFMT1||0) + (p.PostFMT2||0) + (p.PostFMT3||0)) > 0;

  // your current logic (tweak if needed)
  if (!hasDonor && !hasPre && hasPost) return "emerged";
  if (hasPre && !hasPost)              return "disappeared";
  if (hasPre && hasPost)               return "persisted";
  if (hasDonor && !hasPre && hasPost)  return "transferred";

  return "persisted";
}


// ---------- Build Sankey rows from parent graph ----------
function buildSankeyRowsFromParentGraph(parentJson, disease) {
  const nodes = parentJson?.nodes || [];
  const links = (parentJson?.links || []).filter(l => !l.isColo); // temporal only

  const nodeById = new Map(nodes.map(n => [n.id, n]));

  // 1) Presence per (argId|mgeId) across phases for this disease
  const presence = new Map(); // key -> {donor,pre,post1,post2,post3}

  for (const n of nodes) {
    const cnt = Number(n.diseaseCounts?.[disease] || 0);
    if (!Number.isFinite(cnt) || cnt <= 0) continue;

    const key = colocKeyFromNode(n);
    const phase = tpToPhase(Number(n.timepoint));

    if (!presence.has(key)) {
      presence.set(key, { Donor:0, PreFMT:0, PostFMT1:0, PostFMT2:0, PostFMT3:0 });
    }
    presence.get(key)[phase] += cnt;
  }

  // 2) Build raw rows from temporal edges
  const rows = [];

  for (const e of links) {
    const s = nodeById.get(e.source);
    const t = nodeById.get(e.target);
    if (!s || !t) continue;

    // Disease counts at nodes
    const sCount = Number(s.diseaseCounts?.[disease] || 0);
    const tCount = Number(t.diseaseCounts?.[disease] || 0);
    if ((!Number.isFinite(sCount) || sCount <= 0) && (!Number.isFinite(tCount) || tCount <= 0)) continue;

    // Identity must match (same arg+mge across time)
    const key = colocKeyFromNode(s);
    const p = presence.get(key);
    if (!p) continue;

    const status = classifyStatus(p);

    const from = tpToPhase(Number(e.sourceTimepoint));
    const to   = tpToPhase(Number(e.targetTimepoint));

    // --- IMPORTANT: enforce forward-only to avoid sankey cycles ---
    if (from === to) continue;
    if ((phaseIndex.get(to) ?? -1) <= (phaseIndex.get(from) ?? -1)) continue;
    // if (phaseIndex.get(to) <= phaseIndex.get(from)) continue;


    // Flow value proxy (since links have no counts)
    const value = Math.min(
      Number.isFinite(sCount) ? sCount : 0,
      Number.isFinite(tCount) ? tCount : 0
    );

    if (!Number.isFinite(value) || value <= 0) continue;

    rows.push({ from, to, status, patients: value });
  }

  // 3) Merge rows by (from,to,status)
  const merged = d3.rollups(
    rows,
    v => d3.sum(v, d => d.patients),
    d => d.from,
    d => d.to,
    d => d.status
  );

  const flat = [];
  for (const [from, toArr] of merged) {
    for (const [to, statusArr] of toArr) {
      for (const [status, patients] of statusArr) {
        if (patients > 0) flat.push({ from, to, status, patients });
      }
    }
  }

  return flat;
}

let SANKEY_RAW = null; // this will hold graph2.json

function drawSankey(disease = document.getElementById("sankeyDiseaseSelect")?.value) {
  sankeyG.selectAll("*").remove();

  if (!SANKEY_RAW) {
    console.warn("SANKEY_RAW not loaded yet");
    return;
  }

  const rows = buildSankeyRowsFromParentGraph(SANKEY_RAW, disease);

  if (!rows.length) {
    sankeyG.append("text")
      .attr("x", 520)
      .attr("y", 180)
      .attr("text-anchor", "middle")
      .style("fill", "#6c757d")
      .style("font-size", "36px")
      .style("font-weight", 700)
      .text("No temporal flows for this disease.");
    return;
  }

  const graph = buildSankeyGraph(rows);
  const sankeyW = 1160;
  const sankeyH = 360; 

  const sankey = d3.sankey()
    .nodeWidth(18)
    .nodePadding(26)
    .nodeSort(null)     // keep input order within columns
    .linkSort(null)     // optional: reduces reshuffling
    .extent([[0, 0], [sankeyW, sankeyH]]);


  const sankeyData = sankey({
    nodes: graph.nodes.map(d => ({ ...d })),
    links: graph.links.map(d => ({ ...d }))
  });

  // // Links
  // sankeyG.append("g")
  //   .attr("fill", "none")
  //   .selectAll("path")
  //   .data(sankeyData.links)
  //   .join("path")
  //   .attr("d", d3.sankeyLinkHorizontal())
  //   .attr("stroke", d => colorMap[d.status] || "#999")
  //   .attr("stroke-width", d => Math.max(1.2, d.width * 0.55))
  //   .attr("stroke-opacity", 0.40)
  //   .attr("stroke-linecap", "round");

  const link = sankeyG.append("g")
    .attr("fill", "none")
    .selectAll("path")
    .data(sankeyData.links)
    .join("path")
    .attr("d", d3.sankeyLinkHorizontal())
    .attr("stroke", d => colorMap[d.status] || "#999")
    .attr("stroke-width", d => Math.max(1.5, d.width))
    .attr("stroke-opacity", 0.55)
    .attr("stroke-linecap", "round");

  // --- Hover tooltip for links ---
  link
    .on("mouseenter", (event, d) => {
      showTip(
        `<div style="font-weight:600">${d.source.name} → ${d.target.name}</div>
        <div><b>${d3.format(",")(d.value)}</b> patients</div>
        <div style="text-transform:capitalize">${d.status}</div>`,
        event
      );
    })
    .on("mousemove", moveTip)
    .on("mouseleave", hideTip);


  // Nodes
  const node = sankeyG.append("g")
    .selectAll("g")
    .data(sankeyData.nodes)
    .join("g");

  node.append("rect")
    .attr("x", d => d.x0)
    .attr("y", d => d.y0)
    .attr("height", d => d.y1 - d.y0)
    .attr("width", d => d.x1 - d.x0)
    .attr("rx", 6)
    .attr("fill", "#E5E7EB")
    .attr("stroke", "#CBD5E1");

  node
    .on("mouseenter", (event, d) => {
      showTip(
        `<div style="font-weight:600">${d.name}</div>
        <div><b>${d3.format(",")(d.value)}</b> patients total</div>`,
        event
      );
    })
    .on("mousemove", moveTip)
    .on("mouseleave", hideTip);


  node.append("text")
    .attr("x", d => d.x0 < 600 ? d.x1 + 10 : d.x0 - 10)
    .attr("y", d => (d.y0 + d.y1) / 2)
    .attr("dy", "0.35em")
    .attr("text-anchor", d => d.x0 < 600 ? "start" : "end")
    .style("font-size", "22px")
    .style("font-weight", 600)
    .style("fill", "#111827")
    .text(d => d.name);

}

function drawSankeyLegendBox() {
  const legend = d3.select("#sankeyLegendBox");
  legend.selectAll("*").remove();

  Object.keys(colorMap).forEach(k => {
    const row = legend.append("div").attr("class", "chart-legend-item");

    row.append("div")
      .attr("class", "chart-legend-dot")
      .style("background", colorMap[k]);

    row.append("div")
      .text(k.charAt(0).toUpperCase() + k.slice(1));
  });
}


d3.json("json/graph2.json").then(raw => {
  SANKEY_RAW = raw;

  // derive disease list from node.diseaseCounts keys
  const diseaseSet = new Set();
  (SANKEY_RAW.nodes || []).forEach(n => {
    Object.keys(n.diseaseCounts || {}).forEach(k => diseaseSet.add(k));
  });
  const diseases = Array.from(diseaseSet).sort();

  const sel = d3.select("#sankeyDiseaseSelect");
  sel.selectAll("option")
    .data(diseases)
    .join("option")
    .attr("value", d => d)
    .text(d => diseaseNames[d] || d);

  const defaultDisease = diseases.includes("Melanoma") ? "Melanoma" : diseases[0];
  sel.property("value", defaultDisease);

  drawSankey(defaultDisease);
  drawSankeyLegendBox();

  sel.on("change", function() {
    drawSankey(this.value);
  });
});

function showTip(html, event) {
  tip.html(html)
    .style("opacity", 1)
    .style("left", `${event.offsetX}px`)
    .style("top", `${event.offsetY}px`);
}

function moveTip(event) {
  tip.style("left", `${event.offsetX}px`)
     .style("top", `${event.offsetY}px`);
}

function hideTip() {
  tip.style("opacity", 0);
}
